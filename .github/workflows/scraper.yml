name: Product Price Scraper

on:
  schedule:
    # Codziennie o 8:00 czasu polskiego (UTC+1 zimą / UTC+2 latem).
    # Cron działa w UTC, więc 7:00 UTC ≈ 8:00 czasu zimowego w Polsce.
    # Latem (czas letni) faktyczna godzina przesunie się o 1h (~9:00).
    - cron: "0 7 * * *"
  workflow_dispatch: {}  # pozwala też odpalić ręcznie z zakładki "Actions" na GitHubie

permissions:
  contents: write  # potrzebne, żeby workflow mógł zapisać (commit) plik CSV z powrotem do repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser (Chromium)
        run: playwright install --with-deps chromium

      - name: Run scraper
        run: python scraper.py

      - name: Upload debug screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: debug_screenshot.png

      - name: Commit and push results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add products_data.csv
          git diff --staged --quiet || git commit -m "Automatyczna aktualizacja cen $(date +'%Y-%m-%d')"
          git push
